title: むかわけい 公式ホームページ
url: https://kmukawa.jp
baseurl: ""
markdown: kramdown
permalink: /blog/:year:month:day/

collections:
  archive:
    output: true
    permalink: /archive/:name/

plugins:
  - jekyll-sitemap

exclude:
  - README.md
  - node_modules/
  - CLAUDE.md
  - docs/
  - netlify/
  - netlify.toml
  # 内部ファイル・非公開資料（261119 追加：Search Console 対応時に公開されていたのを発見）
  - AGENTS.md
  - CLAUDE.md.bak_260920
  - "*.bak*"
  - Gemfile
  - Gemfile.lock
  - scripts/
  - vendor/
  - .bundle/
  - _headers

defaults:
  - scope:
      path: ""
      type: "archive"
    values:
      layout: "post"
  - scope:
      path: "_posts"
      type: "posts"
    values:
      layout: "post"
  # sitemap から画像・CSS・JS・管理画面を除外（jekyll-sitemap 用）
  - scope:
      path: "images"
    values:
      sitemap: false
  - scope:
      path: "css"
    values:
      sitemap: false
  - scope:
      path: "js"
    values:
      sitemap: false
  - scope:
      path: "admin"
    values:
      sitemap: false
